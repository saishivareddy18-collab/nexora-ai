<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexora AI — 3D Demo</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: #050816;
      font-family: Arial, sans-serif;
      color: white;
    }

    #scene {
      position: fixed;
      inset: 0;
    }

    .overlay {
      position: fixed;
      top: 40px;
      left: 40px;
      z-index: 10;
      pointer-events: none;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .logo span {
      color: #7c5cff;
    }

    .tagline {
      margin-top: 10px;
      max-width: 420px;
      color: #9da5c0;
      line-height: 1.6;
    }

    .controls {
      position: fixed;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      gap: 10px;
    }

    button {
      border: 1px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.07);
      color: white;
      padding: 12px 18px;
      border-radius: 12px;
      cursor: pointer;
      backdrop-filter: blur(12px);
    }

    button:hover {
      background: rgba(255,255,255,.15);
    }
  </style>
</head>

<body>

  <div id="scene"></div>

  <div class="overlay">
    <div class="logo">Nexora<span>AI</span></div>
    <div class="tagline">
      Intelligent systems. One powerful AI layer.
      Explore the Nexora 3D interface.
    </div>
  </div>

  <div class="controls">
    <button onclick="toggleRotation()">Pause / Play</button>
    <button onclick="changeMode()">Change Mode</button>
  </div>

  <!-- Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <script>
    // -----------------------------
    // SCENE
    // -----------------------------

    const scene = new THREE.Scene();

    scene.fog = new THREE.FogExp2(0x050816, 0.025);

    // -----------------------------
    // CAMERA
    // -----------------------------

    const camera = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    camera.position.set(0, 0, 7);

    // -----------------------------
    // RENDERER
    // -----------------------------

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true
    });

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    document
      .getElementById("scene")
      .appendChild(renderer.domElement);

    // -----------------------------
    // LIGHTS
    // -----------------------------

    const ambientLight = new THREE.AmbientLight(
      0xffffff,
      1.5
    );

    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(
      0x7c5cff,
      20,
      20
    );

    pointLight.position.set(0, 2, 4);

    scene.add(pointLight);

    // -----------------------------
    // MAIN AI CORE
    // -----------------------------

    const coreGroup = new THREE.Group();

    scene.add(coreGroup);

    // Inner sphere
    const coreGeometry = new THREE.IcosahedronGeometry(
      1.25,
      4
    );

    const coreMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x684cff,
      emissive: 0x29127a,
      emissiveIntensity: 2,
      roughness: 0.15,
      metalness: 0.4,
      transparent: true,
      opacity: 0.92
    });

    const core = new THREE.Mesh(
      coreGeometry,
      coreMaterial
    );

    coreGroup.add(core);

    // -----------------------------
    // WIREFRAME SHELL
    // -----------------------------

    const shellGeometry =
      new THREE.IcosahedronGeometry(1.6, 2);

    const shellMaterial =
      new THREE.MeshBasicMaterial({
        color: 0x9b8cff,
        wireframe: true,
        transparent: true,
        opacity: 0.28
      });

    const shell = new THREE.Mesh(
      shellGeometry,
      shellMaterial
    );

    coreGroup.add(shell);

    // -----------------------------
    // ORBIT RINGS
    // -----------------------------

    const rings = [];

    function createRing(
      radius,
      rotationX,
      rotationY,
      rotationZ
    ) {

      const geometry =
        new THREE.TorusGeometry(
          radius,
          0.012,
          16,
          150
        );

      const material =
        new THREE.MeshBasicMaterial({
          color: 0x7c5cff,
          transparent: true,
          opacity: 0.7
        });

      const ring = new THREE.Mesh(
        geometry,
        material
      );

      ring.rotation.x = rotationX;
      ring.rotation.y = rotationY;
      ring.rotation.z = rotationZ;

      coreGroup.add(ring);

      rings.push(ring);
    }

    createRing(1.9, Math.PI / 2, 0, 0);
    createRing(2.1, 0.5, 0.7, 0);
    createRing(2.0, -0.7, 0.2, 0.5);

    // -----------------------------
    // PARTICLE FIELD
    // -----------------------------

    const particleCount = 1800;

    const positions = new Float32Array(
      particleCount * 3
    );

    for (let i = 0; i < particleCount; i++) {

      const radius =
        3 + Math.random() * 7;

      const theta =
        Math.random() * Math.PI * 2;

      const phi =
        Math.acos(
          2 * Math.random() - 1
        );

      positions[i * 3] =
        radius *
        Math.sin(phi) *
        Math.cos(theta);

      positions[i * 3 + 1] =
        radius *
        Math.sin(phi) *
        Math.sin(theta);

      positions[i * 3 + 2] =
        radius *
        Math.cos(phi);
    }

    const particleGeometry =
      new THREE.BufferGeometry();

    particleGeometry.setAttribute(
      "position",
      new THREE.BufferAttribute(
        positions,
        3
      )
    );

    const particleMaterial =
      new THREE.PointsMaterial({
        color: 0x8e82ff,
        size: 0.025,
        transparent: true,
        opacity: 0.8
      });

    const particles =
      new THREE.Points(
        particleGeometry,
        particleMaterial
      );

    scene.add(particles);

    // -----------------------------
    // AI DATA NODES
    // -----------------------------

    const nodes = [];

    for (let i = 0; i < 20; i++) {

      const geometry =
        new THREE.SphereGeometry(
          0.045,
          16,
          16
        );

      const material =
        new THREE.MeshBasicMaterial({
          color: 0xb7afff
        });

      const node =
        new THREE.Mesh(
          geometry,
          material
        );

      const angle =
        (i / 20) * Math.PI * 2;

      node.position.set(
        Math.cos(angle) * 2.5,
        Math.sin(angle * 2) * 0.7,
        Math.sin(angle) * 2.5
      );

      scene.add(node);

      nodes.push(node);
    }

    // -----------------------------
    // CONNECTION LINES
    // -----------------------------

    const lineMaterial =
      new THREE.LineBasicMaterial({
        color: 0x6655ff,
        transparent: true,
        opacity: 0.25
      });

    for (let i = 0; i < nodes.length; i++) {

      const geometry =
        new THREE.BufferGeometry();

      const positions =
        new Float32Array(6);

      geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
          positions,
          3
        )
      );

      const line =
        new THREE.Line(
          geometry,
          lineMaterial
        );

      line.userData.node = nodes[i];

      scene.add(line);
    }

    // -----------------------------
    // MOUSE INTERACTION
    // -----------------------------

    let mouseX = 0;
    let mouseY = 0;

    document.addEventListener(
      "mousemove",
      (event) => {

        mouseX =
          (event.clientX /
            window.innerWidth -
            0.5)
